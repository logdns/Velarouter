[package]
name = "vr-terminal"
description = "Read-only ANSI viewer for Velarouter remote desktops"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "velarouter-view"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
vr-client = { path = "../vr-client" }
vr-net = { path = "../vr-net" }
vr-proto = { path = "../vr-proto" }
vr-session = { path = "../vr-session" }
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
rpassword = "7.5.5"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
