[package]
name = "vr-desktop"
description = "Velarouter desktop client (macOS/Windows/Linux)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "velarouter-desktop"
path = "src/main.rs"

[dependencies]
vr-client = { path = "../vr-client" }
vr-agent = { path = "../vr-agent" }
vr-net = { path = "../vr-net" }
vr-proto = { path = "../vr-proto" }
vr-session = { path = "../vr-session" }
eframe = { version = "0.37", features = ["persistence", "wgpu"] }
egui = "0.37"
xcap = "0.9"
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
rfd = "0.18"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rand.workspace = true
igd-next = { version = "0.18", features = ["aio_tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["async-io", "settings"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = {version="0.61",features=["Win32_NetworkManagement_IpHelper","Win32_Networking_WinSock","Win32_UI_HiDpi"]}
