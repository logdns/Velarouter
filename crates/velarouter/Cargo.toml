[package]
name = "velarouter"
description = "Velarouter command line: signal server, agent, headless probe and diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "velarouter"
path = "src/main.rs"

[dependencies]
vr-proto = { path = "../vr-proto" }
vr-crypto = { path = "../vr-crypto" }
vr-net = { path = "../vr-net" }
vr-signal = { path = "../vr-signal" }
vr-agent = { path = "../vr-agent" }
vr-session = { path = "../vr-session" }
vr-p2p = { path = "../vr-p2p" }
vr-meet = { path = "../vr-meet" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
url = "2"
vr-transport = { path = "../vr-transport" }

clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
uuid.workspace = true
sha2.workspace = true
xcap = "0.9"
