<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Velarouter">
  <defs>
    <linearGradient id="vr-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="0.55" stop-color="#63B8F2"/>
      <stop offset="1" stop-color="#7EE0C1"/>
    </linearGradient>
    <radialGradient id="vr-halo" cx="0.5" cy="0.32" r="0.72">
      <stop offset="0" stop-color="#4F8CFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4F8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vr-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="232" fill="#0B0D10"/>
  <rect x="32" y="32" width="960" height="960" rx="232" fill="url(#vr-halo)"/>
  <rect x="33" y="33" width="958" height="958" rx="231" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <rect x="32" y="32" width="960" height="480" rx="232" fill="url(#vr-sheen)"/>

  <!-- motion arcs -->
  <path d="M214 452c-34 46-52 100-52 150" fill="none" stroke="url(#vr-grad)"
        stroke-opacity="0.38" stroke-width="26" stroke-linecap="round"/>
  <path d="M176 402c-46 62-70 132-70 200" fill="none" stroke="url(#vr-grad)"
        stroke-opacity="0.18" stroke-width="22" stroke-linecap="round"/>

  <!-- the route: two hops meeting at a node -->
  <path d="M306 336 L512 700 L718 336" fill="none" stroke="url(#vr-grad)"
        stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M306 336 L512 700 L718 336" fill="none" stroke="#FFFFFF"
        stroke-opacity="0.16" stroke-width="26" stroke-linecap="round"
        stroke-linejoin="round" transform="translate(0 -14)"/>

  <!-- endpoints -->
  <circle cx="306" cy="336" r="34" fill="#0B0D10"/>
  <circle cx="306" cy="336" r="34" fill="none" stroke="#7EE0C1" stroke-width="20"/>
  <circle cx="718" cy="336" r="34" fill="#0B0D10"/>
  <circle cx="718" cy="336" r="34" fill="none" stroke="#4F8CFF" stroke-width="20"/>

  <!-- hop node -->
  <circle cx="512" cy="700" r="86" fill="#0B0D10"/>
  <circle cx="512" cy="700" r="86" fill="none" stroke="url(#vr-grad)" stroke-width="18"
          stroke-opacity="0.55"/>
  <circle cx="512" cy="700" r="44" fill="#EAF3FF"/>
  <circle cx="512" cy="700" r="44" fill="url(#vr-grad)" fill-opacity="0.35"/>
</svg>
