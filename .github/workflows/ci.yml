name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo bash scripts/linux-build-deps.sh
      - run: rustup override set 1.95.0 && rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: sudo apt-get install -y --no-install-recommends xvfb xauth x11-xserver-utils pulseaudio pulseaudio-utils
      - name: Desktop wall over four LAN sessions
        run: bash scripts/test-desktop-wall.sh
      - name: Synthetic PulseAudio capture and playback
        run: bash scripts/test-linux-audio.sh
      - name: Test experimental media features
        run: |
          cargo test --workspace --locked --features vr-desktop/h264,vr-desktop/linux-audio
          bash scripts/test-desktop-wall.sh --features h264,linux-audio
      - run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit

  webviewer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webviewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webviewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit

  go:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum
      - run: go test ./... && go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.0.1
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - name: Scan committed source for secrets
        run: |
          set -euo pipefail
          tree=$(mktemp -d)
          trap 'rm -rf "$tree"' EXIT
          git archive HEAD | tar -x -C "$tree"
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner --config .gitleaks.toml "$tree"
